<div id="root"></div>
<script type="text/babel" data-presets="react" data-type="module">
const React = window.React;

/* ---------- lightweight icon set — local recreations standing in for lucide-react
   so this file runs standalone with no build step / package install ---------- */
function Icon({ size = 24, color = "currentColor", viewBox = "0 0 24 24", fill = "none", children }) {
  return (
    <svg width={size} height={size} viewBox={viewBox} fill={fill} stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      {children}
    </svg>
  );
}
function ArrowRight({ size, color }) { return <Icon size={size} color={color}><path d="M5 12h14M13 6l6 6-6 6"/></Icon>; }
function Send({ size, color }) { return <Icon size={size} color={color}><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></Icon>; }
function CreditCard({ size, color }) { return <Icon size={size} color={color}><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></Icon>; }
function Receipt({ size, color }) { return <Icon size={size} color={color}><path d="M4 2.5 5.7 4l1.8-1.5L9.2 4 11 2.5 12.8 4l1.7-1.5L16.3 4 18 2.5v19L16.3 20l-1.8 1.5L12.8 20 11 21.5 9.2 20l-1.7 1.5L5.7 20 4 21.5Z"/><path d="M8 7h8M8 11h8M8 15h5"/></Icon>; }
function HandCoins({ size, color }) { return <Icon size={size} color={color}><circle cx="9" cy="8" r="5"/><circle cx="15" cy="15" r="5"/></Icon>; }
function Smartphone({ size, color }) { return <Icon size={size} color={color}><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></Icon>; }
function Fingerprint({ size, color }) { return <Icon size={size} color={color}><path d="M12 3a8 8 0 0 0-8 8c0 3.5 1.5 5.5 1.5 9"/><path d="M12 3a8 8 0 0 1 8 8c0 1.8-.3 3.4-.9 4.7"/><path d="M8 11a4 4 0 0 1 8 0c0 4.5 1.5 6.5 1.5 8.5"/><path d="M12 11v4a4 4 0 0 0 3 3.9"/></Icon>; }
function Lock({ size, color }) { return <Icon size={size} color={color}><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>; }
function Wallet({ size, color }) { return <Icon size={size} color={color}><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4h-5a2 2 0 0 1 0-4Z"/></Icon>; }
function Star({ size, color }) { return <Icon size={size} color={color} fill={color}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></Icon>; }
function QrCode({ size, color }) { return <Icon size={size} color={color}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM19 17h2v4h-4v-2"/></Icon>; }
function Quote({ size, color }) { return <Icon size={size} color={color} fill={color}><path d="M7 8c-2 0-3.2 1.4-3.2 3.4C3.8 13.4 5 15 7 15v3c-3.6 0-6-2.6-6-6.4C1 7.2 3.6 5 7 5Zm10 0c-2 0-3.2 1.4-3.2 3.4 0 2 1.2 3.6 3.2 3.6v3c-3.6 0-6-2.6-6-6.4C11 7.2 13.6 5 17 5Z"/></Icon>; }
function PlayCircle({ size, color }) { return <Icon size={size} color={color}><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill={color}/></Icon>; }
function Facebook({ size, color }) { return <Icon size={size} color={color} fill={color}><path d="M14 9h3V5.6c-.5-.07-2.1-.2-3-.2-3 0-4.5 1.8-4.5 4.6V12H7v3.6h2.5V22h3.6v-6.4h2.9l.5-3.6h-3.4v-2c0-.6.2-1 1.4-1Z"/></Icon>; }
function Linkedin({ size, color }) { return <Icon size={size} color={color} fill={color}><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/><path d="M10 9h3.6v1.9h.05c.5-1 1.8-2 3.6-2 3.9 0 4.75 2.4 4.75 5.6V21H18v-5.7c0-1.35 0-3.1-2-3.1-2 0-2.3 1.5-2.3 3.05V21H10z"/></Icon>; }
function Instagram({ size, color }) { return <Icon size={size} color={color}><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill={color}/></Icon>; }
function ShieldCheck({ size, color }) { return <Icon size={size} color={color}><path d="M12 21s7.5-3.7 7.5-9.3V5.5L12 3 4.5 5.5v6.2C4.5 17.3 12 21 12 21Z"/><path d="m9 11.5 2 2 4-4.2"/></Icon>; }
function Globe2({ size, color }) { return <Icon size={size} color={color}><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2c2.5 2.7 4 6.4 4 10s-1.5 7.3-4 10c-2.5-2.7-4-6.4-4-10s1.5-7.3 4-10Z"/></Icon>; }


/* ---------- Design tokens ---------- */
const TEAL = "#00D9A6";
const TEAL_DARK = "#00B98F";
const INK = "#0B211D";
const INK_SOFT = "#10281F";
const BG = "#F4FBF9";
const BLACK = "#0A0A0A";
const GOLD = "#F2A65A";
const GOLD_LIGHT = "#FBCE96";
const PEACH_BG = "#FDEEE1";

const display = "'Space Grotesk', ui-sans-serif, system-ui, sans-serif";
const body = "'Inter', ui-sans-serif, system-ui, sans-serif";

/* ---------- Logo mark: a stylized Teal Card ---------- */
function LogoMark({ size = 28 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 32 32" fill="none">
      <rect x="1" y="4" width="30" height="24" rx="6" fill={TEAL} />
      <rect x="5" y="11" width="6" height="4.5" rx="1.2" fill={INK} opacity="0.85" />
      <path
        d="M22 12c1.2 1 1.9 2.4 1.9 4s-.7 3-1.9 4"
        stroke={INK}
        strokeWidth="1.6"
        strokeLinecap="round"
        opacity="0.85"
      />
      <path
        d="M24.6 10c2 1.7 3.2 4 3.2 6.5s-1.2 4.8-3.2 6.5"
        stroke={INK}
        strokeWidth="1.6"
        strokeLinecap="round"
        opacity="0.5"
      />
    </svg>
  );
}

/* ---------- Coin: SadaPay's signature floating gold-coin motif ---------- */
function Coin({ size = 44 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 44 44" fill="none">
      <defs>
        <radialGradient id={`coinGrad-${size}`} cx="35%" cy="30%" r="75%">
          <stop offset="0%" stopColor={GOLD_LIGHT} />
          <stop offset="100%" stopColor={GOLD} />
        </radialGradient>
      </defs>
      <circle cx="22" cy="22" r="20" fill={`url(#coinGrad-${size})`} stroke="#E08F3E" strokeWidth="1.5" />
      <circle cx="22" cy="22" r="14" fill="none" stroke="#FFFFFF" strokeOpacity="0.5" strokeWidth="1.3" strokeDasharray="2 3" />
      <text x="22" y="27" textAnchor="middle" fontFamily={display} fontWeight="700" fontSize="14" fill="#7A4718">
        S
      </text>
    </svg>
  );
}

function FloatingCoin({
  size = 44,
  top,
  left,
  right,
  bottom,
  delay = 0,
  duration = 4,
}) {
  return (
    <div
      className="float-coin"
      style={{
        position: "absolute",
        top,
        left,
        right,
        bottom,
        animationDelay: `${delay}s`,
        animationDuration: `${duration}s`,
        filter: "drop-shadow(0 10px 14px rgba(224,143,62,0.35))",
      }}
    >
      <Coin size={size} />
    </div>
  );
}

/* ---------- Pill button ---------- */
function PillButton({ children, dark = true, size = "base" }) {
  const fontSize = size === "lg" ? 18 : 16;
  return (
    <span
      style={{
        display: "inline-flex",
        alignItems: "center",
        gap: 12,
        background: dark ? INK : TEAL,
        color: dark ? "#FFFFFF" : INK,
        fontFamily: body,
        fontWeight: 500,
        fontSize,
        paddingLeft: 28,
        paddingRight: 6,
        paddingTop: 6,
        paddingBottom: 6,
        borderRadius: 999,
        cursor: "pointer",
        transition: "opacity 200ms",
      }}
      className="hover:opacity-90"
    >
      {children}
      <span
        style={{
          background: dark ? TEAL : INK,
          borderRadius: 999,
          padding: 10,
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
        }}
      >
        <ArrowRight size={18} color={dark ? INK : "#FFFFFF"} />
      </span>
    </span>
  );
}

/* ---------- Marquee brand item ---------- */
function RailItem({ text, style, colorOpacity = 0.55 }) {
  return (
    <span className="mx-7 shrink-0 whitespace-nowrap" style={{ color: `rgba(10,10,10,${colorOpacity})`, ...style }}>
      {text}
    </span>
  );
}

/* ---------- Feature card w/ icon + coin ---------- */
function FeatureCard({ icon, title, body: text }) {
  return (
    <div
      className="rounded-2xl p-6 flex flex-col justify-between relative overflow-hidden"
      style={{ minHeight: 220, background: PEACH_BG }}
    >
      <FloatingCoin size={30} top="14px" right="18px" delay={0.4} duration={3.4} />
      <div
        style={{
          width: 44,
          height: 44,
          borderRadius: 12,
          background: "#FFFFFF",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
        }}
      >
        {icon}
      </div>
      <div className="mt-6">
        <h3 style={{ fontFamily: display, fontWeight: 600, letterSpacing: "-0.01em", color: INK }} className="text-lg mb-1">
